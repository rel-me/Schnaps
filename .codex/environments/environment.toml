version = 1
name = "Schnaps"

[setup]
script = "mise install && mise run setup"

[[actions]]
name = "Run Debug App"
icon = "run"
command = "mise exec -- make dev-open"

[[actions]]
name = "Test"
icon = "tool"
command = "mise run test"

[[actions]]
name = "Plan Beta"
icon = "tool"
command = "mise exec -- make plan-beta"

[[actions]]
name = "Build Release Tool"
icon = "tool"
command = "mise exec -- make build/tools/schnaps-release"

[[actions]]
name = "Publish Beta"
icon = "tool"
command = "mise exec -- make beta"

[[actions]]
name = "Publish Stable Release"
icon = "tool"
command = "mise exec -- make release"
